# ============================================================
# 平台优先级（数据采集顺序）
# ============================================================
platform_priority:
  secondary_market:
    - dewu       # 得物：国内潮玩二级市场首选
    - xianyu     # 闲鱼：挂单/成交数据丰富
    - stockx     # StockX：海外潮玩二级市场
    - ebay       # eBay：海外市场参考
    - taobao     # 淘宝：补充数据
  social:
    - xiaohongshu  # 小红书：国内核心社媒
    - tiktok       # TikTok：海外社媒
    - instagram    # Instagram：海外视觉社交
    - douyin       # 抖音：国内短视频
    - weibo        # 微博：国内话题热度
    - bilibili     # B站：开箱/测评内容
