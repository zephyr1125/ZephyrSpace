# management-archive Skill Eval 配置
# 规则来源: plan/management_archive_eval_PLAN.md

suite: management_archive
skill_path: management-archive/SKILL.md
dataset_version: "0.1"

judge:
  backend: null          # null | llm
  llm:
    base_url_env: EVAL_LLM_BASE_URL
    api_key_env: EVAL_LLM_API_KEY
    model_env: EVAL_LLM_MODEL
    default_model: "gpt-4o-mini"
    temperature: 0.0
    timeout_seconds: 120
    max_retries: 2
  # 关键 judge case 重复运行次数（取均值/多数票）
  repeat_runs: 1
  # 高风险 case 双 judge 独立评分；差异过大置 manual_review
  double_judge_threshold: 0.4

# 各维度权重（合计 100）
weights:
  trigger: 5
  workflow: 15
  structure: 10
  facts: 25
  grounding: 20
  analysis: 15
  calibration: 5
  regression: 5

# Hard Gates（任一不通过 => Overall FAIL）
gates:
  p0_errors:
    max: 0
  critical_fact_accuracy:
    min: 0.98
  grounded_claim_rate:
    min: 0.90
  required_tool_recall:
    min: 0.95
  trigger_accuracy:
    min: 0.95
  score_math:
    required: true
  required_sections:
    required: true
  minimum_lines:
    value: 150

# 确定性结构约束
structure:
  filename_regex: '^.+ 管理层档案 ([0-9]|[1-9][0-9]|100) \d{4}-\d{2}-\d{2}\.md$'
  min_lines: 150
  required_frontmatter:
    - aliases
    - 公司
    - 股票代码
    - 分析日期
    - 数据截止日期
  ticker_patterns:
    - '^\d{6}\.(SH|SZ)$'
    - '^\d{4,5}\.HK$'
    - '^[A-Z]{1,5}\.US$'
  dimension_max:
    诚信与透明度: 20
    资本配置能力: 25
    战略稳定性: 15
    对股东友好度: 15
    危机处理能力: 10
    组织与人才能力: 10
    表达清晰度与认知质量: 5
  red_flag_thresholds:
    诚信与透明度: 8     # <=8 触发红旗
    资本配置能力: 10    # <=10 触发红旗
  quick_reference_marker: "📊 快速参考"
  sections:
    - "一、管理层画像"
    - "二、言行一致性追踪"
    - "三、资本配置记录"
    - "四、对股东友好度"
    - "五、危机处理记录"
    - "六、组织与人才"
    - "七、互动易/IR 态度"
    - "八、监管与合规记录"
    - "九、管理层"
    - "十、关键原文摘录"
    - "十一、综合结论"
# 评分校准
calibration:
  score_drift_threshold: 8
  pairwise_required: true

# 分析质量 judge rubric（1-5 分）
analysis_judges:
  counter_evidence: {max_score: 5}
  action_vs_outcome: {max_score: 5}
  capital_allocation: {max_score: 5}
  strategic_consistency: {max_score: 5}
  crisis_handling: {max_score: 5}
  uncertainty: {max_score: 5}

# 路径
paths:
  cases_dir: evals/cases/management_archive
  golden_facts_dir: evals/fixtures/golden_facts
  reports_dir: evals/reports
  skill_default: management-archive/SKILL.md
  archives_dir: 管理层档案
  company_dir: 01-公司
  deep_analysis_dir: 深度分析

# 触发词规则（与 SKILL.md 触发条件对齐，供 trigger grader 使用）
trigger:
  positive_keywords:
    - 管理层档案
    - 老板档案
    - 管理层尽调
    - 管理层评估
    - 管理层靠不靠谱
    - 管理层靠谱
    - 管理层怎么样
    - 管理层质量
    - 全面分析
    - 拉取财报并全面分析
    - management archive
  negative_hint_keywords:
    - PE
    - 估值
    - 股价
    - 市盈率
    - 市净率
    - 自由现金流
    - 财报
